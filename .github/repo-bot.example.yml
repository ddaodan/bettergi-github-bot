runtime:
  languageMode: auto
  dryRun: false

providers:
  openAiCompatible:
    enabled: false
    baseUrl: https://api.openai.com/v1
    model: gpt-5.4
    apiStyle: auto
    timeoutMs: 30000

issues:
  autoProcessing:
    skipCreatedBefore: auto
  subIssues:
    mode: relaxed
    includeParentContext: true
    parentBodyMaxChars: 2000
  titleGeneration:
    enabled: true
    maxLength: 100
    detectMismatch: true
    mismatchConfidence: 0.9
    placeholderTitles:
      - bug
      - feature
      - suggestion
      - question
      - feedback
      - issue
      - 问题
      - 反馈
      - 建议
      - 标题
      - 请填写标题
      - 请简要描述问题
  validation:
    enabled: true
    fallbackTemplateKey: bug
    commentAnchor: issue-bot:validation
    autoClose:
      enabled: false
      reopenWhenValid: true
    templates:
      - key: bug
        issueType: Bug  # 可选：模板匹配后同步组织级 Issue Type（需要组织仓库且 Type 名称存在）
        detect:
          markers:
            - bug
          titlePrefixes:
            - "[bug]"
        requiredSections:
          - id: environment
            aliases:
              - Environment
          - id: steps
            aliases:
              - Steps to Reproduce
          - id: expected
            aliases:
              - Expected Behavior
        labels:
          whenValid: []
          whenInvalid:
            - 需要更多信息
      - key: feature
        issueType: Feature
        detect:
          markers:
            - feature
          titlePrefixes:
            - "[feature]"
        requiredSections:
          - id: summary
            aliases:
              - Summary
          - id: motivation
            aliases:
              - Motivation
        labels:
          whenValid: []
          whenInvalid:
            - 需要更多信息
      - key: question
        issueType: Question
        detect:
          markers:
            - question
          titlePrefixes:
            - "[question]"
        requiredSections:
          - id: summary
            aliases:
              - Question
        labels:
          whenValid: []
          whenInvalid:
            - 需要更多信息
    duplicateDetection:
      enabled: true
      bypassLabels:
        - 跳过重复检测
      duplicateLabel: 重复
      searchResultLimit: 50
      candidateLimit: 20
      aiReviewMaxCandidates: 3
      thresholds:
        exact: 0.995
        highConfidence: 0.93
        reviewMin: 0.82
      similarityComment:
        enabled: true
        commentAnchor: issue-bot:similar-issues
        minScore: 0.3
        maxCandidates: 3
  labeling:
    enabled: true
    autoCreateMissing: true
    managed:
      - BUG
      - 功能建议
      - 问题咨询
      - 需要更多信息
      - 重复
      - 需要 AI 分析
    definitions:
      BUG:
        color: d73a4a
        description: 缺陷反馈。
      功能建议:
        color: a2eeef
        description: 功能建议或改进请求。
      问题咨询:
        color: 7057ff
        description: 使用问题或咨询。
      需要更多信息:
        color: fbca04
        description: Issue 缺少必要信息。
      重复:
        color: cfd3d7
        description: 已存在相同或高度相似的问题。
      需要 AI 分析:
        color: 0e8a16
        description: 已满足 AI 辅助分析条件。
    keywordRules:
      - keywords:
          - crash
        labels:
          - 需要 AI 分析
        fields:
          - title
          - body
        caseSensitive: false
    aiClassification:
      enabled: false
      maxLabels: 3
      minConfidence: 0.65
      include: []
      exclude:
        - 重复
      prompt: 优先选择和具体功能模块、子系统或使用场景直接相关的标签，避免只选择流程状态标签。
      sourceRepository:
        owner: babalae
        repo: better-genshin-impact
  codeContext:
    source: workspace
    includeInAiHelp: false
    includeInFix: true
    indexPath: ""
    indexRoot: ""
    categorySectionAliases: []
    nameSectionAliases: []
    pathSectionAliases: []
    categoryRoots: {}
  aiHelp:
    enabled: false
    triggerLabels:
      - 需要 AI 分析
    commentAnchor: issue-bot:ai
    projectContext:
      enabled: true
      includeRepositoryMetadata: true
      includeReadme: true
      readmeMaxChars: 3000
      profile:
        name: BetterGI
        aliases:
          - BGI
          - Better Genshin Impact
        summary: Desktop automation assistant for Genshin Impact.
        techStack:
          - C#
          - WPF
          - .NET
  commands:
    enabled: false
    mentions:
      - "@bot"
    access: collaborators
    fix:
      enabled: false
      commentAnchor: issue-bot:fix
    refresh:
      enabled: false

pullRequests:
  review:
    enabled: false
  labeling:
    enabled: false
  summary:
    enabled: false
  # 按改动文件所在目录自动打类型标签（脚本仓库常用）
  pathLabels:
    enabled: false
    managed: true
    documentationLabel: documentation
    commentAnchor: pull-bot:path-labels
    rules:
      - label: JS 脚本
        pathPrefixes:
          - repo/js
        # 必须是 repo/js/<脚本名>/ 内的文件；根目录散落文件不算脚本
        requireSubdirectory: true
      - label: 地图追踪
        pathPrefixes:
          - repo/pathing
      - label: 战斗策略
        pathPrefixes:
          - repo/combat
      - label: 七圣召唤
        pathPrefixes:
          - repo/tcg
  # 提交位置检查：放错大类目录时只发参考性评论，不阻塞合并
  locationCheck:
    enabled: false
    commentAnchor: pull-bot:location
    allowedPaths:
      - build
      - .github
    scriptRoots:
      - repo/js
    fileKindRules:
      - category: 策略文件
        expectedLocations:
          - repo/combat
          - repo/tcg
        extensions:
          - .txt
    rules:
      pathingFileNamePattern: ^\d{2,3}-
  # PR 合并后关闭它实际解决的 Issue（未写 close 关键词时自动补上）
  issueLink:
    enabled: false
    commentAnchor: pull-bot:issue-link
    appendCloseKeyword: true
    closeKeywordTemplate: "close #{number}"
    requireSameRepository: true
